name: date_js
description: "date-js - Flutter app (dating app in the making), built on the Synk design system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter

  # State management, routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Design system
  cached_network_image: ^4.0.4
  haptic_feedback: ^0.8.0
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope_300Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope_400Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope_800ExtraBold.ttf
          weight: 800
    - family: PermanentMarker
      fonts:
        - asset: assets/fonts/permanent_marker/PermanentMarker-Regular.ttf
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/young_serif/YoungSerif-Regular.ttf
